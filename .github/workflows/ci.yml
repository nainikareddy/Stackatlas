name: ci

on:
  push:
    branches: [main, master, hackathon]
  pull_request:

jobs:
  evals:
    name: evals + self-verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Self-verify shipped catalog
        run: python -m evals.verify mcp_server/catalog.json
      - name: Score demo catalog (reward gate)
        # 0.70, not 0.85: docgen's LLM output is non-deterministic -- an
        # observed regeneration swung 0.883 -> 0.814 with no accuracy
        # regression (see IMPROVEMENT_CHANGELOG.md and labels.py's
        # HEALTH_TOLERANCE note for the same phenomenon on the health
        # score specifically). 0.85 was tight enough to fail a catalog
        # with no real quality problem; 0.70 still fails a genuinely
        # broken/empty catalog (0.100-0.507 per evals/README.md) while
        # tolerating normal run-to-run wobble on a good one.
        run: python -m evals.run_eval --threshold 0.70
      - name: Run test suite
        run: python -m pytest -q

  build:
    name: dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
